kind = "web"
previewPath = "/"
title = "EEMM - Formulação"
version = "1.0.0"
id = "artifacts/eemm-client"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24749

[services.development]
run = "pnpm --filter @workspace/eemm-client run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eemm-client", "run", "build" ]
publicDir = "artifacts/eemm-client/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24749"
BASE_PATH = "/"
